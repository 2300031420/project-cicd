services:
  db:
    image: mysql:8.0
    container_name: food-delivery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 932545
      MYSQL_DATABASE: fooddelivery
    ports:
     - "3310:3306"

    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./onlinefooddelivery-backend
    container_name: food-delivery-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fooddelivery
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 932545   # Must match MySQL root password
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./onlinefooddelivery-frontend
    container_name: food-delivery-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
